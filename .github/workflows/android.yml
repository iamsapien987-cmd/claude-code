# Build the APK on GitHub's runners.
#
# The development container has no route to dl.google.com, so it can neither
# fetch the Android SDK nor the Android Gradle Plugin. GitHub's Ubuntu runners
# ship the SDK preinstalled and have unrestricted network, so the build
# happens here instead of on anybody's laptop. Every push produces a
# downloadable APK, and the run log is the compiler output.

name: Android

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Simulation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install
      - name: Install a browser for the headless render checks
        run: npx playwright install --with-deps chromium
      - name: Physics invariants
        run: node --test "test/*.test.mjs"
      - name: Build the single-file bundle
        run: node tools/build.mjs
      - name: Check the built page runs, and that the panel stays black
        run: |
          node tools/verify-bundle.mjs
          I=1.0 node tools/oled.mjs
      - name: Check taps land where they should
        run: node tools/tap-check.mjs
      - name: Check the crackle follows the flame, and does not leak
        run: node tools/audio-check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: candle-html
          path: dist/candle.html

  apk:
    name: APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Rebuild the bundle rather than trusting the copy in assets, so the APK
      # can never ship a page that is behind the sources.
      - name: Build the web bundle into assets
        run: node tools/build.mjs

      - name: Fail if the committed asset was stale
        run: |
          if ! git diff --quiet -- android/app/src/main/assets/candle.html; then
            echo "::warning::android assets/candle.html was out of date and has been rebuilt"
            git --no-pager diff --stat -- android/app/src/main/assets/candle.html
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Also build the release variant, unsigned. It is not installable and is
      # not uploaded, but building it proves the shipping configuration
      # compiles rather than leaving that to be discovered at release time.
      - name: Assemble release (unsigned, compile check only)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Confirm the shipping build is not debuggable
        run: |
          set -e
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          REL=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $REL"
          if "$AAPT" dump badging "$REL" 2>/dev/null | grep -q "application-debuggable"; then
            echo "::error::release APK is debuggable"; exit 1
          fi
          echo "ok: release build is not debuggable"

      - name: Report sizes
        run: ls -lh android/app/build/outputs/apk/*/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: candle-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
