<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="A candle simulated from first principles: buoyant combustion, blackbody radiation, and real wax melting.">
<title>Real Candle</title>
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="ui">
    <div id="readout" aria-live="polite"></div>

    <div id="toolbar" role="toolbar" aria-label="Modes">
      <button class="tool" id="btnMic"   aria-pressed="false" title="Blow out with the microphone" aria-label="Microphone blow-out">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button class="tool" id="btnFocus" aria-pressed="false" title="25-minute focus session" aria-label="Focus timer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>
      </button>
      <button class="tool" id="btnRead"  aria-pressed="false" title="Reading light" aria-label="Reading light">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h6a3 3 0 0 1 3 3v11a2.5 2.5 0 0 0-2.5-2.5H3zM21 5h-6a3 3 0 0 0-3 3v11a2.5 2.5 0 0 1 2.5-2.5H21z"/></svg>
      </button>
      <button class="tool" id="btnSound" aria-pressed="false" title="Wick crackle" aria-label="Sound">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM17 9.5a3.5 3.5 0 0 1 0 5M19.5 7a7 7 0 0 1 0 10"/></svg>
      </button>
      <button class="tool" id="btnRain"  aria-pressed="false" title="Rain on the roof" aria-label="Rain">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 15a4 4 0 0 1 .4-8 5.5 5.5 0 0 1 10.4 1.6A3.5 3.5 0 0 1 17.5 15z"/><path d="M8.5 18.5 8 21M12 18.5 11.5 21M15.5 18.5 15 21"/></svg>
      </button>
      <button class="tool" id="btnZen"   aria-pressed="false" title="Hide everything" aria-label="Solitude mode">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.5"/></svg>
      </button>
      <button class="tool" id="btnLock"  aria-pressed="false" title="Lock the screen" aria-label="Lock screen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
      </button>
    </div>

    <div id="dial" role="slider" tabindex="0" aria-label="Flame intensity"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="70">
      <div id="dialTrack"></div>
      <div id="dialGlow"></div>
      <div id="dialKnob"></div>
      <div id="dialFlame"></div>
    </div>
    <div id="hint">Slide the dial up or down &middot; tap the flame to snuff it</div>

  </div>

  <!--
    Where to tap to light the candle again. Positioned over the wick from
    script, so it follows the candle down as it burns rather than sitting at a
    fixed place on the screen.

    Deliberately a sibling of #ui rather than a child. #ui animates a transform
    when it fades in and out, and an element with a transform becomes the
    containing block for position:fixed descendants - which parked this button
    several hundred pixels below the screen for the whole 900 ms of the fade.
    It follows #ui's dim state through a class instead.
  -->
  <button id="relight" type="button" aria-label="Light the candle" hidden>
    <span id="relightRing" aria-hidden="true"></span>
    <span id="relightLabel">Tap to light</span>
  </button>

  <div id="timerBar"><span id="timerText"></span><span id="timerNote"></span></div>
  <div id="toast"></div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
