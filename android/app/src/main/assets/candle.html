/**
 * Air movement: the room's own draft, the phone's motion, and you blowing
 * on the microphone.
 *
 * Blowing a candle out is not about "enough wind". A flame is a balance
 * between the rate at which the chemistry can release heat and the rate at
 * which the flow carries that heat away - the ratio of the two is the
 * Damkohler number. Stretch the flame past a critical strain rate, roughly
 * 150-200 per second for a hydrocarbon diffusion flame, and the reaction
 * cannot keep up with its own losses, so it detaches from the wick and dies.
 * That is why a sharp puff works and steady breathing does not.
 */


class AirModel {
  constructor() {
    this.draftX = 0;
    this.draftY = 0;
    this.tiltX = 0;
    this.blow = 0;          // 0..1, current blow strength from the mic
    this.strain = 0;        // 1/s, strain rate experienced by the flame
    this.extinguishFor = 0; // s, how long we have been past the critical strain
    this.micReady = false;
    this.micError = null;
    this.micAttempts = 0;
    this.enabled = true;
  }

  /**
   * The ambient draft is modelled as an Ornstein-Uhlenbeck process: a random
   * walk that is pulled back towards zero. That gives air motion which
   * wanders on a realistic timescale instead of jittering every frame, and it
   * is what makes an untouched flame lean and recover on its own.
   */
  update(dt) {
    // Guard the timestep: exp() of a positive exponent gives a > 1, and the
    // sqrt below would then take the root of a negative number.
    if (!(dt > 0)) return;
    const a = Math.exp(-dt / DRAFT_TAU);
    const noise = Math.sqrt(1 - a * a) * DRAFT_SIGMA;
    this.draftX = this.draftX * a + (Math.random() * 2 - 1) * noise * 1.7;
    this.draftY = this.draftY * a + (Math.random() * 2 - 1) * noise * 0.6;

    if (this.nativeMic) this.sampleNativeMic();
    else if (this.analyser) this.sampleMic();
    else this.blow *= Math.exp(-dt / 0.25);

    const u = Math.abs(this.windX()) ;
    // Strain rate seen by the flame is the velocity difference across it.
    this.strain = u / (FLAME_DIAMETER * 0.5);
    if (this.strain > EXTINCTION_STRAIN) this.extinguishFor += dt;
    else this.extinguishFor = Math.max(0, this.extinguishFor - dt * 2.5);
  }

  windX() {
    return this.draftX + this.tiltX + this.blow * BLOW_VELOCITY_MAX;
  }

  windY() {
    return this.draftY;
  }

  /** True once the flame has been over-strained long enough to detach. */
  shouldExtinguish() {
    return this.extinguishFor > 0.045;
  }

  /**
   * Blowing produces a broadband rush of air noise across the microphone
   * membrane, concentrated well below 500 Hz and quite unlike speech or
   * music, which have structure higher up. Comparing the two bands separates
   * a real puff from someone talking near the phone.
   */
  /**
   * Ask the native shell for the OS microphone permission, if there is one.
   *
   * Resolves true when the app may use the microphone. In a plain browser
   * there is no shell and this is a no-op: the browser's own prompt happens
   * inside getUserMedia as usual.
   */
  async ensureHostPermission() {
    const host = window.CandleHost;
    if (!host || typeof host.requestMicPermission !== 'function') return true;
    try {
      if (host.hasMicPermission()) return true;
    } catch (e) {
      return true;   // older shell without the check; let getUserMedia try
    }
    return new Promise((resolve) => {
      let settled = false;
      const done = (ok) => {
        if (settled) return;
        settled = true;
        window.__candleMicPermission = null;
        resolve(ok);
      };
      window.__candleMicPermission = (granted) => done(granted === true || granted === 'true');
      // If the dialog is dismissed without an answer we would otherwise wait
      // forever, so give up rather than leaving the button stuck.
      setTimeout(() => done(false), 90000);
      try { host.requestMicPermission(); } catch (e) { done(false); }
    });
  }

  /**
   * Capture through the native shell, which does not use the WebView's media
   * stack at all.
   *
   * This is tried first when the shell offers it. getUserMedia has failed on
   * a real device with every WebView-side cause ruled out - permission held,
   * secure context, a device enumerated, no activity pause, and a bare
   * { audio: true } refused - so on Android the browser path is now the
   * fallback rather than the other way round. In a plain browser there is no
   * shell and nothing changes.
   */
  enableNativeMic() {
    const host = window.CandleHost;
    if (!host || typeof host.startMic !== 'function') return false;
    this.micMode = 'native';
    this.micAttempts += 1;
    let ok = false;
    try {
      ok = host.startMic() === true;
    } catch (e) {
      this.micError = 'native capture threw';
      return false;
    }
    if (!ok) {
      this.micError = 'native capture refused';
      return false;
    }
    this.nativeMic = true;
    this.micReady = true;
    this.micError = null;
    this.quiet = undefined;
    return true;
  }

  async enableMic() {
    if (this.analyser || this.nativeMic) return true;
    this.micAttempts = 0;
    if (this.enableNativeMic()) return true;

    // How many audio inputs does the WebView believe exist? If this is zero
    // the problem is upstream of anything this app is asking for.
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      this.inputCount = devices.filter((d) => d.kind === 'audioinput').length;
    } catch (e) {
      this.inputCount = -1;
    }

    // The OS permission is acquired *before* getUserMedia, never during it.
    // Asking from inside the getUserMedia call pauses the activity, which
    // suspends the WebView and tears the media stack down under the in-flight
    // request; it came back as NotReadableError on a real device.
    const permitted = await this.ensureHostPermission();
    if (!permitted) {
      this.micError = 'permission refused';
      return false;
    }

    // Ask for the ideal capture first, then fall back.
    //
    // Turning off echo cancellation, noise suppression and gain control is
    // what makes a blown breath detectable - noise suppression is designed to
    // remove exactly that. But many Android devices cannot disable them: there
    // is no raw path through the audio driver, and asking for one fails to
    // open the device at all. That comes back as NotReadableError, which reads
    // like a hardware fault and is really an unsatisfiable request.
    //
    // A working microphone with processing applied still detects a puff; it is
    // attenuated, not gone. So a plain request is tried next, and a
    // deliberately un-processed voice-style capture after that.
    const ATTEMPTS = [
      { label: 'raw', wait: 0, constraints: { audio: {
        echoCancellation: false, noiseSuppression: false, autoGainControl: false } } },
      { label: 'raw retry', wait: 400, constraints: { audio: {
        echoCancellation: false, noiseSuppression: false, autoGainControl: false } } },
      { label: 'plain', wait: 300, constraints: { audio: true } },
      { label: 'plain retry', wait: 900, constraints: { audio: true } },
    ];
    for (const step of ATTEMPTS) {
      if (step.wait) await new Promise((r) => setTimeout(r, step.wait));
      try {
        this.micAttempts += 1;
        this.micMode = step.label;
        const stream = await navigator.mediaDevices.getUserMedia(step.constraints);
        const Ctx = window.AudioContext || window.webkitAudioContext;
        this.audioCtx = this.audioCtx || new Ctx();
        if (this.audioCtx.state === 'suspended') await this.audioCtx.resume();
        const src = this.audioCtx.createMediaStreamSource(stream);
        const analyser = this.audioCtx.createAnalyser();
        analyser.fftSize = 1024;
        analyser.smoothingTimeConstant = 0.35;
        src.connect(analyser);
        this.analyser = analyser;
        this.stream = stream;
        this.bins = new Float32Array(analyser.frequencyBinCount);
        // Processing left on costs sensitivity, so the threshold is relaxed
        // to compensate rather than the feature being quietly useless.
        this.processed = step.label.startsWith('plain');
        this.micReady = true;
        this.micError = null;
        return true;
      } catch (err) {
        this.micError = (err && err.name) || 'unavailable';
        // Only a device that would not open is worth another shape of
        // request. Anything else is final.
        if (this.micError !== 'NotReadableError' && this.micError !== 'OverconstrainedError') {
          return false;
        }
      }
    }
    return false;
  }

  disableMic() {
    if (this.nativeMic) {
      try { window.CandleHost.stopMic(); } catch (e) { /* already gone */ }
      this.nativeMic = false;
    }
    if (this.stream) for (const t of this.stream.getTracks()) t.stop();
    this.stream = null;
    this.analyser = null;
    this.micReady = false;
    this.blow = 0;
  }

  /** Read the two band energies the native capture publishes. */
  sampleNativeMic() {
    let parts;
    try {
      parts = window.CandleHost.micLevels().split(',');
    } catch (e) {
      return;
    }
    const low = parseFloat(parts[0]);
    const high = parseFloat(parts[1]);
    if (!(low >= 0) || !(high >= 0)) return;
    this.applyBlow(low, high);
  }

  /**
   * Decide how hard you are blowing, from the energy in the two bands.
   *
   * The threshold adapts to the room rather than being a constant. Native
   * capture reports a plain RMS whose scale depends on the sensitivity of the
   * phone's microphone and on which audio source the ladder settled on, and
   * neither of those can be measured from here - guessing a fixed number
   * would be the same mistake that cost three attempts at this already.
   * Tracking the quiet level and asking for a large multiple of it works
   * whatever that scale turns out to be.
   */
  applyBlow(low, high) {
    if (this.quiet === undefined) this.quiet = low;
    // Settle onto a new quiet level quickly, drift up from it very slowly.
    // The asymmetry is the whole point: a puff lasts under a second and must
    // not drag its own reference up with it, while a fan or traffic outside
    // should become the new normal over about twenty seconds rather than
    // holding the candle out indefinitely.
    this.quiet += (low - this.quiet) * (low < this.quiet ? 0.08 : 0.0008);
    const floor = Math.max(this.quiet * 3.5, 0.004);
    const span = Math.max(this.quiet * 14, 0.05);
    const level = Math.max(0, (low - floor) / span);
    // A puff is loud low down and comparatively quiet up top.
    const ratio = low / (high + 1e-9);
    const isBreath = ratio > 2.2 ? 1 : Math.max(0, (ratio - 1.1) / 1.1);
    const target = Math.min(1, level * isBreath);
    // Rise fast, fall slowly: a flame keeps moving after the puff stops.
    this.blow += (target - this.blow) * (target > this.blow ? 0.55 : 0.10);
  }

  sampleMic() {
    const a = this.analyser;
    a.getFloatFrequencyData(this.bins);
    const nyquist = this.audioCtx.sampleRate / 2;
    const binHz = nyquist / this.bins.length;
    const lowMax = Math.floor(450 / binHz);
    const highMin = Math.floor(1200 / binHz);

    let low = 0, lowN = 0, high = 0, highN = 0;
    for (let i = 2; i < this.bins.length; i++) {
      const db = this.bins[i];
      const lin = db < -110 ? 0 : Math.pow(10, db / 20);
      if (i <= lowMax) { low += lin; lowN++; }
      else if (i >= highMin) { high += lin; highN++; }
    }
    low = lowN ? low / lowN : 0;
    high = highN ? high / highN : 0;

    // A puff is loud low down and comparatively quiet up top.
    const ratio = low / (high + 1e-6);
    // A stream with noise suppression and gain control left on delivers far
    // less of a breath than a raw one, so the floor moves with it.
    const floor = this.processed ? 0.0007 : 0.0016;
    const gain = this.processed ? 420 : 240;
    const level = Math.max(0, (low - floor) * gain);
    const isBreath = ratio > 2.2 ? 1 : Math.max(0, (ratio - 1.1) / 1.1);
    const target = Math.min(1, level * isBreath);
    // Rise fast, fall slowly: a flame keeps moving after the puff stops.
    this.blow += (target - this.blow) * (target > this.blow ? 0.55 : 0.10);
  }

  /** Tilting the phone drags the air across the flame. */
  attachTilt() {
    if (this._tiltBound) return;
    this._tiltBound = (e) => {
      const gamma = e.gamma || 0;               // left-right tilt, degrees
      this.tiltX = Math.max(-0.9, Math.min(0.9, gamma / 45)) * 0.32;
    };
    window.addEventListener('deviceorientation', this._tiltBound, true);
  }
}

/**
 * A plain-text account of why the microphone is not working.
 *
 * The toast tells you what to do; this tells you what actually happened, so a
 * failure on a device I cannot reach can be screenshotted and sent back
 * rather than guessed at. Reached by holding the microphone button.
 */
function micDiagnostics(air) {
  const host = window.CandleHost;
  const lines = [];
  lines.push(`error: ${air.micError || 'none'}`);
  lines.push(`attempts: ${air.micAttempts || 0}`);
  lines.push(`last mode: ${air.micMode || 'none'}`);
  lines.push(`audio inputs: ${air.inputCount === undefined ? 'unknown' : air.inputCount}`);
  lines.push(`native shell: ${host ? 'yes' : 'no'}`);
  lines.push(`capture: ${air.nativeMic ? 'native' : (air.analyser ? 'webview' : 'none')}`);
  if (host && typeof host.micReport === 'function') {
    try {
      const report = host.micReport();
      if (report) lines.push(report);
    } catch (e) {
      lines.push('native report: unavailable');
    }
  }
  if (host && typeof host.hasMicPermission === 'function') {
    try {
      lines.push(`OS permission: ${host.hasMicPermission() ? 'granted' : 'not granted'}`);
    } catch (e) {
      lines.push('OS permission: check failed');
    }
  }
  lines.push(`getUserMedia: ${navigator.mediaDevices ? 'available' : 'missing'}`);
  lines.push(`secure context: ${window.isSecureContext ? 'yes' : 'no'}`);
  return lines.join('\n');
}

/**
 * Wick crackle, synthesised rather than sampled.
 *
 * A burning wick makes two sounds: a broad low hiss from the convective
 * plume, and sharp irregular ticks as trapped moisture and impurities in the
 * wick flash to vapour. The ticks arrive as a Poisson process - independent
 * events at a roughly constant average rate - so they are generated that way
 * here instead of being looped. A loop of any length eventually becomes
 * recognisable, which ruins the illusion faster than anything visual.
 *
 * Synthesising it also keeps the app tiny: no audio assets to ship.
 */

class Crackle {
  constructor() {
    this.ctx = null;
    this.on = false;
    this.level = 0;
  }

  start() {
    if (this.ctx) { this.resume(); return; }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    this.ctx = ctx;

    this.master = ctx.createGain();
    this.master.gain.value = 0;
    this.master.connect(ctx.destination);

    // Two seconds of white noise, looped, is the source for everything.
    const n = ctx.sampleRate * 2;
    const buf = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;

    // The steady plume hiss: noise rolled off hard at the top.
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 720;
    lp.Q.value = 0.6;
    this.hissGain = ctx.createGain();
    this.hissGain.gain.value = 0.055;
    src.connect(lp).connect(this.hissGain).connect(this.master);
    src.start();
    this.hissSrc = src;

    this.on = true;
    this.schedule();
  }

  /** One tick: a very short band-passed noise burst with a fast decay. */
  pop(when, strength) {
    const ctx = this.ctx;
    const src = ctx.createBufferSource();
    src.buffer = this.noise;
    src.loop = true;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 900 + Math.random() * 2600;
    bp.Q.value = 1.4 + Math.random() * 5;
    const g = ctx.createGain();
    const peak = 0.06 + Math.random() * 0.22 * strength;
    const dur = 0.012 + Math.random() * 0.055;
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(peak, when + 0.0016);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    src.connect(bp).connect(g).connect(this.master);
    src.start(when);
    src.stop(when + dur + 0.02);
  }

  /**
   * Schedule the next batch of ticks. Poisson arrivals mean the gap between
   * events is exponentially distributed, so we just draw the gaps.
   */
  schedule() {
    if (!this.ctx || !this.on) return;
    const ctx = this.ctx;
    const horizon = 0.6;
    let t = Math.max(ctx.currentTime, this.nextAt || ctx.currentTime);
    const rate = 1.4 + this.level * 5.5;      // ticks per second
    while (t < ctx.currentTime + horizon) {
      t += -Math.log(1 - Math.random()) / rate;
      if (t > ctx.currentTime) this.pop(t, 0.4 + this.level);
    }
    this.nextAt = t;
    this.timer = setTimeout(() => this.schedule(), 400);
  }

  /** Track the flame: louder and busier as the dial goes up. */
  setLevel(level, lit) {
    this.level = level;
    if (!this.ctx) return;
    const target = lit ? 0.10 + level * 0.55 : 0;
    this.master.gain.setTargetAtTime(target, this.ctx.currentTime, 0.25);
    if (this.hissGain) {
      this.hissGain.gain.setTargetAtTime(0.03 + level * 0.06, this.ctx.currentTime, 0.3);
    }
  }

  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }

  stop() {
    if (!this.ctx) return;
    this.on = false;
    clearTimeout(this.timer);
    this.master.gain.setTargetAtTime(0, this.ctx.currentTime, 0.2);
    setTimeout(() => {
      if (this.on) return;
      try { this.hissSrc.stop(); } catch (e) { /* already stopped */ }
      this.ctx.close();
      this.ctx = null;
    }, 700);
  }
}

// renderer.js
// ==================================================================

/**
 * Rendering. Everything drawn here is driven by the simulation state; there
 * are no keyframes and no hand-authored flame shape anywhere in this file.
 *
 * The layer order mirrors how the light physically arrives at your eye:
 *
 *   1. the light the flame throws into the room, falling off as 1/r^2
 *   2. the surface the candle stands on, lit by that light
 *   3. the wax body, lit from above and glowing from within where the flame
 *      heats it (paraffin is translucent - Beer-Lambert through ~6 mm)
 *   4. the molten pool and the charred wick
 *   5. the flame itself, as blackbody emission from soot plus the blue
 *      chemiluminescent reaction zone at its base
 *   6. bloom, which is what the eye and the camera both do with a source
 *      this much brighter than its surroundings
 */





const ROOM_RGB = blackbodyRGB(T_COLOR_ROOM).map((c) => Math.round(255 * encodeSrgb(c)));

/** Diffuse reflectance of unlit paraffin: a warm off-white, not a neutral one. */
const WAX_ALBEDO = [0.96, 0.91, 0.80];

/** Vertical squash of the top-face ellipse: we look slightly down on the candle. */
const TILT = 0.19;
/** Beer-Lambert attenuation length of light inside paraffin, metres. */
const WAX_SCATTER_LENGTH = 0.006;
/**
 * Emission from the solver that corresponds to a fully lit scene. Measured
 * from the solver itself with tools/calibrate.mjs rather than guessed.
 */
const EMISSION_REF = 20000;

/**
 * Converts illuminance in the model's units to screen alpha. Set so a candle
 * at full tilt lights its immediate surroundings strongly and falls to almost
 * nothing by the edge of the frame, which is roughly what one candle does to
 * a dark room.
 */
const ROOM_LIGHT_GAIN = 7.5e-4;

/**
 * How far the flame's glare extends, as a fraction of the smaller screen
 * dimension. Everything past it is left untouched and so stays exactly black.
 */
const GLARE_REACH = 0.62;

/**
 * Converts illuminance on the surface to screen alpha. Separate from the
 * glare's gain because it is a different quantity: light landing on a
 * diffuse surface, not scattering around the source.
 */
const GROUND_LIGHT_GAIN = 2.6e-4;

/**
 * Ramp a falloff to nothing well before its own outer edge.
 *
 * A gradient that only approaches zero leaves a floor of one or two counts
 * spread over a huge area, which is invisible on a backlit panel and plainly
 * visible as a dull glow on an OLED in a dark room - and it keeps those
 * pixels powered. Bringing the curve to zero at 85% of its radius leaves the
 * outer band genuinely untouched, while the ramp stays smooth enough not to
 * show an edge.
 */
function taper(s) {
  if (s <= 0.35) return 1;
  const t = 1 - (s - 0.35) / 0.5;
  return t <= 0 ? 0 : Math.pow(t, 2.2);
}

/**
 * Anything that would not survive quantisation to 8 bits is snapped to zero,
 * so it costs no light at all rather than one count across half the screen.
 */
function cutoff(a) {
  return a < 1 / 255 ? 0 : a;
}

class Renderer {
  constructor(canvas, field, wax) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: false });
    this.field = field;
    this.wax = wax;

    // Flame is composited from a buffer at simulation resolution.
    this.flameBuf = document.createElement('canvas');
    this.flameBuf.width = field.nx;
    this.flameBuf.height = field.ny;
    this.flameCtx = this.flameBuf.getContext('2d');
    this.flameImg = this.flameCtx.createImageData(field.nx, field.ny);
    this.raster = new FlameRasteriser(field.nx, field.ny);

    // Half-resolution intermediate. Upscaling in two bilinear steps is much
    // smoother than one big jump, and gives the bloom pass something cheap
    // to blur.
    this.mid = document.createElement('canvas');
    this.midCtx = this.mid.getContext('2d');

    this.dpr = 1;
    this.smoothed = 0;                   // low-passed emission, drives the room light
    this.lastFlameHeight = FLAME_HEIGHT;  // metres, kept for tap hit testing
    this.resize();
  }

  /**
   * Perceived brightness of the scene, 0..~1.3.
   *
   * The solver's emission swings over roughly a 40:1 range between the
   * bottom and top of the dial, but perceived lightness is not proportional
   * to luminance. CIE L* is a cube root of relative luminance, and using
   * that here is what makes the dial feel linear under the hand while the
   * underlying radiometry stays honest.
   */
  luminance() {
    return Math.min(1.45, Math.cbrt(Math.max(0, this.smoothed) / EMISSION_REF));
  }

  resize() {
    const c = this.canvas;
    this.dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.round(c.clientWidth * this.dpr);
    const h = Math.round(c.clientHeight * this.dpr);
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
    this.w = w;
    this.h = h;

    // Metres of world visible vertically. The candle plus its flame is about
    // 17 cm, so showing ~34 cm frames it with room to breathe.
    this.viewHeight = 0.34;
    this.scale = h / this.viewHeight;            // pixels per metre
    this.baseY = h * 0.93;                       // where the candle stands
    this.cx = w / 2;

    this.mid.width = Math.max(64, Math.round(this.field.nx * 4));
    this.mid.height = Math.max(64, Math.round(this.field.ny * 4));
  }

  /**
   * Is this point, in CSS pixels, on the flame?
   *
   * Used for tap-to-snuff. The region is derived from where the flame
   * actually is rather than from a fixed fraction of the screen, so it
   * follows the flame as it grows with the dial and descends as the candle
   * burns down. Padded enough to be hittable with a thumb and no more.
   */
  flameHitTest(cssX, cssY) {
    const d = this.dpr;
    const wick = this.wax.wickTop || 0;
    const top = this.py(wick + this.lastFlameHeight) / d;
    const bottom = this.py(wick) / d;
    const cx = this.cx / d;
    const halfW = Math.max(26, (bottom - top) * 0.32);
    const pad = 14;
    return Math.abs(cssX - cx) < halfW + pad
      && cssY > top - pad
      && cssY < bottom + pad;
  }

  /** World metres (x from candle centre, y up from the base) to canvas pixels. */
  px(x) { return this.cx + x * this.scale; }
  py(y) { return this.baseY - y * this.scale; }

  draw(state) {
    const { ctx, w, h } = this;
    const emission = this.field.emission();
    // The room light must not strobe on single-frame noise, but it does have
    // to carry the flame's real flicker, so smooth it only lightly.
    this.smoothed += (emission - this.smoothed) * 0.35;
    // Kept for hit testing, so a tap can find the flame where it is now.
    this.lastFlameHeight = this.field.flameHeight();

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);

    this.drawRoomLight(state);
    this.drawGround(state);
    this.drawCandle(state);
    this.drawPoolAndWick(state);
    this.drawFlame(state);
    this.drawSmoke(state);
    this.drawVignette();
  }

  /**
   * Light thrown into the room. A candle is, by the historical definition of
   * the unit, about one candela; illuminance falls off as 1/r^2, so the
   * gradient stops are placed on that curve rather than eyeballed.
   */
  drawRoomLight(state) {
    const { ctx, w, h } = this;
    const wick = this.wax.wickTop || 0;
    const fx = this.px(0);
    const fy = this.py(wick + 0.018);

    const lum = this.luminance() * LUMINOUS_INTENSITY;
    if (lum <= 0.001) return;

    // Light has to *stop*. On an OLED panel a black pixel is switched off, so
    // any glow that trails away across the whole screen is the display
    // emitting light on its own account rather than the flame lighting
    // something. It is also unphysical: there is no wall and no dust in this
    // scene for a room-filling wash to scatter off. What is real, and what
    // this draws, is the glare close to a very bright small source - light
    // scattered by the air just around it and inside the eye looking at it.
    // Beyond `reach` nothing is drawn at all, so those pixels stay at exactly
    // zero and the panel keeps them off.
    const reach = Math.min(w, h) * GLARE_REACH;
    const g = ctx.createRadialGradient(fx, fy, 0, fx, fy, reach);
    const [r, gr, b] = ROOM_RGB;

    const L = FLAME_HEIGHT;
    const STOPS = 20;
    const span = reach / this.scale;
    for (let i = 0; i <= STOPS; i++) {
      const s = i / STOPS;
      const d = 0.012 + s * span;                      // metres from the flame
      // Extended source: 1/d close in, 1/d^2 far away, crossing over at the
      // flame's own height.
      const e = lum / (d * (d + L));
      // Taper the last part of the curve to nothing so the gradient reaches
      // true zero at `reach` instead of leaving a floor of one or two counts
      // spread across the whole panel.
      const a = i === STOPS ? 0 : cutoff(Math.min(0.62, e * ROOM_LIGHT_GAIN) * taper(s));
      g.addColorStop(s, `rgba(${r}, ${gr}, ${b}, ${a.toFixed(4)})`);
    }
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(fx, fy, reach, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  /** The surface the candle stands on, plus its contact shadow. */
  drawGround(state) {
    const { ctx, w } = this;
    const y = this.baseY;
    const lum = this.luminance();
    const rPx = CANDLE_RADIUS * this.scale;

    // Soft pool of light on the table.
    // Light falling on the surface the candle stands on.
    //
    // For a source at height h above a plane, the illuminance at radial
    // distance r is E = I cos(theta) / d^2 with d = sqrt(r^2 + h^2) and
    // cos(theta) = h/d, so
    //
    //     E(r) = I * h / (d^2 * (d + L))
    //
    // taking the extended-source form of the falloff. The h in the numerator
    // is the part that was missing: the pool used a fixed radius of nine
    // candle-radii no matter how high the flame was, so as the candle burned
    // down and the flame came closer it kept flooding the same wide area from
    // a shorter distance and turned into a floodlight. Now the patch narrows
    // as the flame descends, which is what a light source approaching a table
    // actually does.
    const hFlame = Math.max(0.004, (this.wax.wickTop || 0) + 0.015);
    const L = FLAME_HEIGHT;
    const reach = Math.min(rPx * 9, Math.max(rPx * 2.2, hFlame * 2.4 * this.scale));
    const g = ctx.createRadialGradient(this.cx, y, rPx * 0.4, this.cx, y, reach);
    const [r, gr, b] = ROOM_RGB;
    const spanM = reach / this.scale;
    for (let i = 0; i <= 12; i++) {
      const s = i / 12;
      const rad = s * spanM;                       // metres out along the table
      const d = Math.hypot(rad, hFlame);
      const e = (hFlame / (d * d * (d + L)));
      const a = i === 12 ? 0 : cutoff(Math.min(0.34, e * lum * GROUND_LIGHT_GAIN) * taper(s));
      g.addColorStop(s, `rgba(${r}, ${gr}, ${b}, ${a.toFixed(4)})`);
    }
    // Contact shadow directly under the candle.
    const sh = ctx.createRadialGradient(this.cx, y, 0, this.cx, y, rPx * 1.9);
    sh.addColorStop(0, 'rgba(0, 0, 0, 0.85)');
    sh.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.save();
    ctx.translate(0, y);
    ctx.scale(1, TILT);
    ctx.translate(0, -y);
    ctx.fillStyle = sh;
    ctx.fillRect(this.cx - rPx * 2, y - rPx * 2, rPx * 4, rPx * 4);
    ctx.restore();
  }

  /** Outline of the wax body, used both to fill and to clip. */
  bodyPath(ctx) {
    const wax = this.wax;
    const rPx = CANDLE_RADIUS * this.scale;
    const leftTop = this.py(wax.nodeHeight(0));
    const rightTop = this.py(wax.nodeHeight(PROFILE_N - 1));
    const base = this.baseY;

    ctx.beginPath();
    ctx.moveTo(this.cx - rPx, leftTop);
    ctx.lineTo(this.cx - rPx, base);
    // The bottom of the candle is an ellipse too, seen from the same angle.
    ctx.ellipse(this.cx, base, rPx, rPx * TILT, 0, Math.PI, 0, true);
    ctx.lineTo(this.cx + rPx, rightTop);
    ctx.ellipse(this.cx, rightTop, rPx, rPx * TILT, 0, 0, Math.PI, true);
    ctx.closePath();
  }

  drawCandle(state) {
    const { ctx } = this;
    const wax = this.wax;
    const rPx = CANDLE_RADIUS * this.scale;
    const topY = this.py(wax.nodeHeight(0));
    const lum = this.luminance();

    ctx.save();
    this.bodyPath(ctx);
    ctx.clip();

    // Cylinder shading. The body is lit from a point source directly above,
    // so brightness follows the surface normal turning away from the axis and
    // then falls off down the length of the candle.
    const g = ctx.createLinearGradient(this.cx - rPx, 0, this.cx + rPx, 0);
    const shade = (t) => {
      // t is -1..1 across the diameter; the surface normal's horizontal
      // component is t, so the Lambert term goes as sqrt(1 - t^2).
      const n = Math.sqrt(Math.max(0, 1 - t * t));
      const v = 0.10 + 0.62 * Math.pow(n, 0.85);
      return v;
    };
    // Unlit paraffin is a warm off-white, and the only light falling on it
    // comes from a 1850 K flame. Shading it with neutral greys made it read
    // as grey plastic; multiplying the wax's own albedo by the colour of the
    // light actually illuminating it is what makes it read as wax.
    for (let i = 0; i <= 10; i++) {
      const s = i / 10;
      const v = shade(s * 2 - 1) * lum;
      const c = WAX_ALBEDO.map((a, ch) =>
        Math.round(255 * Math.min(1, v * a * (0.45 + 0.55 * ROOM_RGB[ch] / 255))));
      g.addColorStop(s, `rgb(${c[0]}, ${c[1]}, ${c[2]})`);
    }
    ctx.fillStyle = g;
    this.bodyPath(ctx);
    ctx.fill();

    // Vertical falloff: the far end of the candle is further from the flame.
    const vg = ctx.createLinearGradient(0, topY, 0, this.baseY);
    vg.addColorStop(0, 'rgba(0, 0, 0, 0)');
    vg.addColorStop(0.45, 'rgba(0, 0, 0, 0.35)');
    vg.addColorStop(1, 'rgba(0, 0, 0, 0.80)');
    ctx.fillStyle = vg;
    ctx.fillRect(this.cx - rPx, topY, rPx * 2, this.baseY - topY + 2);

    // Subsurface scattering. Paraffin is translucent, so light from the flame
    // enters the wax near the top and is attenuated with depth following
    // Beer-Lambert with an attenuation length of about 6 mm. This is the
    // warm internal glow that distinguishes real wax from painted plastic.
    const depth = WAX_SCATTER_LENGTH * this.scale;
    const sg = ctx.createLinearGradient(0, topY - depth * 0.5, 0, topY + depth * 5);
    for (let i = 0; i <= 6; i++) {
      const s = i / 6;
      const a = Math.exp(-s * 5 * 0.85) * 0.55 * lum;
      sg.addColorStop(s, `rgba(255, 168, 84, ${a.toFixed(3)})`);
    }
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = sg;
    ctx.fillRect(this.cx - rPx, topY - depth, rPx * 2, depth * 7);
    ctx.globalCompositeOperation = 'source-over';

    this.drawDrips(ctx, rPx, lum);
    ctx.restore();

    // A soft rim on the lit side so the silhouette does not read as a cutout.
    ctx.save();
    this.bodyPath(ctx);
    ctx.clip();
    const rim = ctx.createLinearGradient(this.cx - rPx, 0, this.cx - rPx * 0.55, 0);
    rim.addColorStop(0, `rgba(255, 190, 120, ${(0.22 * lum).toFixed(3)})`);
    rim.addColorStop(1, 'rgba(255, 190, 120, 0)');
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = rim;
    ctx.fillRect(this.cx - rPx, topY, rPx, this.baseY - topY);
    ctx.restore();
  }

  /** Live and set drips running down the outside of the candle. */
  drawDrips(ctx, rPx, lum) {
    const all = this.wax.frozen.concat(this.wax.drips);
    for (const d of all) {
      // Project the drip's azimuth onto the cylinder. A drip sits *on* the
      // surface, so its screen position is R sin(theta), and the surface
      // turns away from the viewer as |theta| grows.
      const st = Math.sin(d.theta);
      const ct = Math.abs(Math.cos(d.theta));
      const x = this.cx + rPx * st;
      const rad = Math.max(1.2, d.radius * this.scale);
      // Seen from the side, a drip near the silhouette is viewed edge-on and
      // so looks narrower than one facing the viewer.
      const wide = rad * Math.max(0.35, ct);

      const y = this.py(d.y);
      const top = this.py(d.startY);

      // Same Lambert term the body uses, so a drip on the turned-away part of
      // the cylinder is shaded like the wax it is sitting on instead of
      // glowing white against it.
      const shade = lum * (0.14 + 0.62 * Math.pow(ct, 0.85));
      const wax = (r, g, b, a = 1) =>
        `rgba(${Math.round(r * shade)}, ${Math.round(g * shade)}, ${Math.round(b * shade)}, ${a})`;

      // The trail it has left behind, standing slightly proud of the wall.
      if (top < y - 0.5) {
        ctx.beginPath();
        ctx.moveTo(x, top);
        ctx.lineTo(x, y);
        ctx.lineWidth = wide * 1.35;
        ctx.lineCap = 'round';
        ctx.strokeStyle = wax(228, 208, 174, 0.92);
        ctx.stroke();
      }

      // The bead at the leading edge. A running drip is drawn out into a
      // teardrop by its own motion; one that has set is round again.
      const speed = Math.min(1, Math.abs(d.vy) / 0.02);
      const tall = wide * (1.25 + speed * 1.6);
      const g = ctx.createRadialGradient(x - wide * 0.3, y - tall * 0.35, 0, x, y, tall * 1.3);
      g.addColorStop(0, wax(255, 247, 230, 0.98));
      g.addColorStop(0.5, wax(233, 212, 178));
      g.addColorStop(1, wax(146, 126, 98, 0.7));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(x, y, wide * 1.1, tall, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /** The molten pool in the crater, and the charred wick standing in it. */
  drawPoolAndWick(state) {
    const { ctx } = this;
    const wax = this.wax;
    const rPx = CANDLE_RADIUS * this.scale;
    const lum = this.luminance();

    // The top face is a crater: a standing rim of wax that never got hot
    // enough to melt, and inside it a pool that has sunk as the wick burned
    // its way down. Both are ellipses because we are looking slightly down on
    // the candle, and the gap between them is the crater wall.
    const rimY = this.py(wax.nodeHeight(0));
    const poolY = this.py(wax.centreHeight());
    const poolR = Math.max(rPx * 0.18, wax.poolRadius * this.scale);

    // Rim: the solid ring of wax, lit from directly above by the flame.
    const rimShade = (t) => 0.16 + 0.70 * Math.pow(Math.sqrt(Math.max(0, 1 - t * t)), 0.8);
    const rg = ctx.createLinearGradient(this.cx - rPx, 0, this.cx + rPx, 0);
    for (let i = 0; i <= 8; i++) {
      const s = i / 8;
      const v = rimShade(s * 2 - 1) * lum;
      // Same rule as the body: the wax's own albedo times the colour of the
      // light falling on it. Neutral greys here read as a metal ring.
      const c = WAX_ALBEDO.map((a, ch) =>
        Math.round(255 * Math.min(1, v * a * (0.45 + 0.55 * ROOM_RGB[ch] / 255))));
      rg.addColorStop(s, `rgb(${c[0]}, ${c[1]}, ${c[2]})`);
    }
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.ellipse(this.cx, rimY, rPx, rPx * TILT, 0, 0, Math.PI * 2);
    ctx.fill();

    // Crater wall, from the rim down to the pool. The far side of the wall
    // faces the viewer and catches the flame; the near side is in shadow
    // behind the rim, so it is drawn darker.
    const depth = Math.max(0, poolY - rimY);
    if (depth > 0.5) {
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(this.cx, rimY, poolR, poolR * TILT, 0, 0, Math.PI * 2);
      ctx.ellipse(this.cx, poolY, poolR, poolR * TILT, 0, 0, Math.PI * 2);
      ctx.rect(this.cx - poolR, rimY, poolR * 2, depth);
      ctx.clip();
      const wg = ctx.createLinearGradient(0, rimY - poolR * TILT, 0, poolY + poolR * TILT);
      // The wall is lit by the flame sitting directly above it, so it runs
      // from shadowed just under the overhanging rim to warm at the pool.
      wg.addColorStop(0, `rgba(${Math.round(96 * lum)}, ${Math.round(72 * lum)}, ${Math.round(48 * lum)}, 1)`);
      wg.addColorStop(0.5, `rgba(${Math.round(206 * lum)}, ${Math.round(168 * lum)}, ${Math.round(120 * lum)}, 1)`);
      wg.addColorStop(1, `rgba(${Math.round(246 * lum)}, ${Math.round(206 * lum)}, ${Math.round(150 * lum)}, 1)`);
      ctx.fillStyle = wg;
      ctx.fillRect(this.cx - poolR - 1, rimY - poolR, poolR * 2 + 2, depth + poolR * 2);
      ctx.restore();
    }

    // The pool itself. Liquid wax is specular where the solid face is matt,
    // so it carries a sharp reflection of the flame sitting right above it.
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(this.cx, poolY, poolR, poolR * TILT, 0, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = `rgba(${Math.round(216 * lum)}, ${Math.round(178 * lum)}, ${Math.round(130 * lum)}, 1)`;
    ctx.fillRect(this.cx - poolR, poolY - poolR, poolR * 2, poolR * 2);
    const pg = ctx.createRadialGradient(this.cx, poolY, 0, this.cx, poolY, poolR);
    pg.addColorStop(0, `rgba(255, 236, 200, ${(0.62 * lum).toFixed(3)})`);
    pg.addColorStop(0.45, `rgba(255, 190, 120, ${(0.26 * lum).toFixed(3)})`);
    pg.addColorStop(1, 'rgba(255, 170, 90, 0)');
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = pg;
    ctx.fillRect(this.cx - poolR, poolY - poolR, poolR * 2, poolR * 2);
    ctx.restore();

    // A thin shadow just inside the rim, which is what actually reads as
    // depth rather than as a flat disc with a lighter disc painted on it.
    ctx.beginPath();
    ctx.ellipse(this.cx, rimY, poolR, poolR * TILT, 0, Math.PI, Math.PI * 2);
    ctx.lineWidth = Math.max(1, rPx * 0.05);
    ctx.strokeStyle = `rgba(${Math.round(64 * lum)}, ${Math.round(46 * lum)}, ${Math.round(30 * lum)}, 0.5)`;
    ctx.stroke();

    // The wick: charred and bent over towards the oxygen-rich outer edge of
    // the flame, which is how a candle trims itself.
    const wy = poolY;
    const tipY = this.py(wax.wickTop);
    const bend = (wax.wickCarbon * 0.55 + 0.15) * (wax.wickTop - wax.centreHeight()) * this.scale;
    ctx.beginPath();
    ctx.moveTo(this.cx, wy);
    ctx.quadraticCurveTo(this.cx + bend * 0.2, (wy + tipY) / 2, this.cx + bend, tipY);
    ctx.lineWidth = Math.max(1.2, 0.0016 * this.scale);
    ctx.lineCap = 'round';
    // Charred carbon, lit by the flame like everything else in this method.
    //
    // This used to switch to a fixed, *lighter* grey when the candle was out,
    // so that the wick stayed findable in the dark. That made it the only
    // thing here not multiplied by lum - lit pixels with nothing lighting
    // them - and a snuffed candle was left with a small mark floating in an
    // otherwise black frame. The relight ring marks the spot properly now, so
    // the wick can go dark with the rest of the scene.
    const wickLum = Math.max(0, lum);
    ctx.strokeStyle = `rgba(${Math.round(24 * wickLum)}, ${Math.round(18 * wickLum)}, `
      + `${Math.round(14 * wickLum)}, 0.95)`;
    ctx.stroke();

    // The base of the wick glows: it sits inside the reaction zone.
    if (state.lit) {
      ctx.globalCompositeOperation = 'lighter';
      const eg = ctx.createRadialGradient(this.cx, wy, 0, this.cx, wy, rPx * 0.7);
      eg.addColorStop(0, `rgba(255, 150, 60, ${0.8 * lum})`);
      eg.addColorStop(1, 'rgba(255, 120, 40, 0)');
      ctx.fillStyle = eg;
      ctx.beginPath();
      ctx.arc(this.cx, wy, rPx * 0.7, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  /**
   * The flame. Soot incandescence is looked up from the precomputed Planck
   * ramp; the blue base is added separately from the reaction rate, because
   * it is chemiluminescence from excited CH and C2 rather than thermal
   * emission and so does not lie on the blackbody locus at all.
   */
  drawFlame(state) {
    const f = this.field;
    const img = this.flameImg;
    this.raster.raster(this.field, img.data);
    this.flameCtx.putImageData(img, 0, 0);

    // Two-stage upscale keeps the bilinear interpolation from showing its
    // diamond pattern, and the small intermediate is cheap to blur.
    const mc = this.midCtx;
    mc.clearRect(0, 0, this.mid.width, this.mid.height);
    mc.imageSmoothingEnabled = true;
    mc.imageSmoothingQuality = 'high';
    mc.filter = 'blur(1.6px)';
    mc.drawImage(this.flameBuf, 0, 0, this.mid.width, this.mid.height);
    mc.filter = 'none';

    const { ctx } = this;
    const wPx = f.nx * f.h * this.scale;
    const hPx = f.ny * f.h * this.scale;
    const x0 = this.cx - wPx / 2;
    const y0 = this.py(this.wax.wickTop) - hPx;

    ctx.globalCompositeOperation = 'lighter';
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    // Bloom: the same image drawn larger and dimmer, twice, approximates the
    // veiling glare of a very bright small source.
    ctx.globalAlpha = 0.30;
    ctx.drawImage(this.mid, x0 - wPx * 0.45, y0 - hPx * 0.10, wPx * 1.9, hPx * 1.2);
    ctx.globalAlpha = 0.42;
    ctx.drawImage(this.mid, x0 - wPx * 0.14, y0 - hPx * 0.03, wPx * 1.28, hPx * 1.06);
    ctx.globalAlpha = 1;
    ctx.drawImage(this.mid, x0, y0, wPx, hPx);

    ctx.globalCompositeOperation = 'source-over';
  }

  /**
   * Smoke. Soot that escapes the reaction zone - which happens in quantity
   * only once the flame is out - rises, spreads by turbulent diffusion, and
   * fades. It is drawn from the same soot field the solver advects.
   */
  drawSmoke(state) {
    if (state.lit && state.blowStrength < 0.15) return;
    const f = this.field;
    const { ctx } = this;
    const wPx = f.nx * f.h * this.scale;
    const hPx = f.ny * f.h * this.scale;
    const x0 = this.cx - wPx / 2;
    const y0 = this.py(this.wax.wickTop) - hPx;
    const cw = f.nx, ch = f.ny;

    if (!this.smokeBuf) {
      this.smokeBuf = document.createElement('canvas');
      this.smokeBuf.width = cw; this.smokeBuf.height = ch;
      this.smokeCtx = this.smokeBuf.getContext('2d');
      this.smokeImg = this.smokeCtx.createImageData(cw, ch);
    }
    const d = this.smokeImg.data;
    let any = false;
    for (let j = 0; j < ch; j++) {
      const row = (ch - 1 - j) * cw * 4;
      for (let i = 0; i < cw; i++) {
        const k = i + j * cw;
        const a = Math.min(1, f.soot[k] * 0.9) * (f.T[k] < T_SOOT_IGNITION ? 1 : 0.15);
        const o = row + i * 4;
        d[o] = 190; d[o + 1] = 186; d[o + 2] = 180;
        d[o + 3] = a * 190;
        if (a > 0.01) any = true;
      }
    }
    if (!any) return;
    this.smokeCtx.putImageData(this.smokeImg, 0, 0);
    ctx.save();
    ctx.filter = 'blur(2px)';
    ctx.globalAlpha = 0.55;
    ctx.drawImage(this.smokeBuf, x0, y0, wPx, hPx);
    ctx.restore();
  }

  drawVignette() {
    const { ctx, w, h } = this;
    const g = ctx.createRadialGradient(w / 2, h * 0.55, Math.min(w, h) * 0.25,
                                       w / 2, h * 0.55, Math.max(w, h) * 0.78);
    g.addColorStop(0, 'rgba(0, 0, 0, 0)');
    g.addColorStop(1, 'rgba(0, 0, 0, 0.55)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }
}

// ==================================================================
// app.js
// ==================================================================

/**
 * Application shell: the simulation loop, the dial, and the modes.
 *
 * The loop runs the fluid solver on a fixed timestep and the renderer on the
 * display's refresh. Fixed steps matter here - a buoyant plume is a genuine
 * instability, so integrating it with a variable dt makes the flicker rate
 * change whenever the frame rate does.
 */







// ---------------------------------------------------------------- simulation
const GRID_NX = 40;
const GRID_NY = 130;
const DOMAIN_W = 0.024;                 // m across the simulated air volume
const SUBSTEP = 1 / 480;                // s, fixed physics step
const MAX_SUBSTEPS = 10;                // guard against spiral-of-death

const field = new FlameField(GRID_NX, GRID_NY, DOMAIN_W / GRID_NX);
const wax = new WaxBody();
const air = new AirModel();
const crackle = new Crackle();

const state = {
  intensity: 0.7,      // the dial, 0..1
  lit: true,
  relight: 0,          // s remaining on the wick ember before it takes
  blowStrength: 0,
  locked: false,       // screen lock: ignores touch, hides everything
  mode: null,          // null | 'focus' | 'reading'
  zen: false,
  sound: false,
  focusLeft: 0,        // ms remaining in the session
  focusPaused: false,
};

// ------------------------------------------------------------------ elements
const canvas = document.getElementById('stage');
const ui = document.getElementById('ui');
const dial = document.getElementById('dial');
const readout = document.getElementById('readout');
const toast = document.getElementById('toast');
const timerBar = document.getElementById('timerBar');
const timerText = document.getElementById('timerText');
const timerNote = document.getElementById('timerNote');
const hint = document.getElementById('hint');
const relightBtn = document.getElementById('relight');
const relightLabel = document.getElementById('relightLabel');
const btn = {
  mic: document.getElementById('btnMic'),
  focus: document.getElementById('btnFocus'),
  read: document.getElementById('btnRead'),
  sound: document.getElementById('btnSound'),
  zen: document.getElementById('btnZen'),
  lock: document.getElementById('btnLock'),
};

const renderer = new Renderer(canvas, field, wax);
window.addEventListener('resize', () => renderer.resize());
window.addEventListener('orientationchange', () => setTimeout(() => renderer.resize(), 120));

// ---------------------------------------------------------------------- dial
let readoutTimer = 0;
function setIntensity(v, haptic = false) {
  const clamped = Math.max(0, Math.min(1, v));
  if (haptic && Math.abs(clamped - state.intensity) > 0.02) buzz(6);
  state.intensity = clamped;
  dial.style.setProperty('--p', clamped.toFixed(3));
  // The arc is a conic gradient starting at the bottom and sweeping 270
  // degrees, so the pointer sits at the same place along that sweep.
  dial.style.setProperty('--angle', `${180 + clamped * 270}deg`);
  dial.setAttribute('aria-valuenow', Math.round(clamped * 100));
  // Show what the simulation is doing while the dial is in hand, then let it
  // go quiet again. A permanent heads-up display of telemetry sitting under a
  // candle undercuts the thing it is measuring.
  readout.classList.add('on');
  clearTimeout(readoutTimer);
  readoutTimer = setTimeout(() => readout.classList.remove('on'), 2600);
}

/** Short vibration, where the platform offers one. */
function buzz(ms) {
  if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) { /* blocked */ } }
}

/**
 * The dial responds to a straight up-or-down drag.
 *
 * It used to track the angle of your finger around the ring with atan2, which
 * is the obvious reading of "dial" and is genuinely hard to use: you have to
 * describe an arc around a 92 px circle with a thumb that is covering it. A
 * vertical drag is what rotary controls in audio software have used for
 * decades, for the same reason. The ring stays as the display - now with a
 * pointer on it - and the whole travel is a comfortable thumb's length.
 */
const DIAL_TRAVEL = 170;   // CSS pixels of drag for the full range
let dragging = false;
let dragStartY = 0;
let dragBase = 0;

function pointerY(e) { return (e.touches ? e.touches[0] : e).clientY; }

function onDown(e) {
  if (state.locked) return;
  dragging = true;
  dragStartY = pointerY(e);
  dragBase = state.intensity;
  dial.setPointerCapture?.(e.pointerId);
  e.preventDefault();
}
function onMove(e) {
  if (!dragging) return;
  setIntensity(dragBase + (dragStartY - pointerY(e)) / DIAL_TRAVEL, true);
  wake();
  e.preventDefault();
}
function onUp() { dragging = false; }

dial.addEventListener('pointerdown', onDown);
window.addEventListener('pointermove', onMove, { passive: false });
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);

dial.addEventListener('keydown', (e) => {
  const step = e.shiftKey ? 0.01 : 0.05;
  if (e.key === 'ArrowUp' || e.key === 'ArrowRight') setIntensity(state.intensity + step);
  else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') setIntensity(state.intensity - step);
  else if (e.key === 'Home') setIntensity(0);
  else if (e.key === 'End') setIntensity(1);
  else if (e.key === ' ' || e.key === 'Enter') { toggleFlame(); e.preventDefault(); }
  else return;
  wake();
  e.preventDefault();
});

// ------------------------------------------------------------- light / relight
function extinguish(reason) {
  if (!state.lit) return;
  state.lit = false;
  state.relight = 0;
  dial.classList.add('out');
  buzz([14, 40, 22]);
  // The screen is about to go black on purpose, so say how to get back in.
  if (reason) showToast(`${reason}\nDouble-tap to wake the screen`);
  crackle.setLevel(0, false);
  syncRelight();
}

function light() {
  if (state.lit) return;
  state.lit = true;
  dial.classList.remove('out');
  air.extinguishFor = 0;
  buzz(12);
  crackle.setLevel(state.intensity, true);
  syncRelight();
}

function toggleFlame() {
  if (wax.spent) { freshCandle(); return; }
  state.lit ? extinguish(null) : light();
}

/**
 * Put the relight marker over the wick, and say what tapping it will do.
 *
 * The wick descends as the candle burns, so this is recomputed rather than
 * placed once. Everything else about hiding it is inherited: the button sits
 * a sibling of #ui rather than inside it - see the markup for why - so it
 * mirrors the interface's sleep state through a class instead of inheriting
 * it.
 */
function syncRelight() {
  // Not gated on zen. Zen hiding the ring meant that blowing the candle out in
  // zen left no way to light it again at all: the ring never appeared, and the
  // canvas tap handler ignores taps in zen too. The .dim class below already
  // does the right thing - zen keeps an empty screen until you tap, and the
  // ring then comes back with the rest of the controls.
  const show = !state.lit && !state.locked;
  relightBtn.hidden = !show;
  relightBtn.classList.toggle('dim', ui.classList.contains('dim'));
  // Only write text when it actually changes. Assigning textContent
  // invalidates layout, and the getBoundingClientRect below then forces it
  // again; doing both every frame is the classic thrash, and here it cost
  // enough frame time that adaptQuality dropped the substep count and
  // visibly changed the flame.
  setText(hint, state.lit
    ? 'Slide the dial up or down \u00b7 tap the flame to snuff it'
    : 'Double-tap to wake \u00b7 tap the ring to light');
  if (!show) return;
  setText(relightLabel, wax.spent ? 'Tap for a fresh candle' : 'Tap to light');
  const r = canvas.getBoundingClientRect();
  const d = renderer.dpr || 1;
  relightBtn.style.left = `${r.left + renderer.px(0) / d}px`;
  relightBtn.style.top = `${r.top + renderer.py(wax.wickTop) / d}px`;
}

function setText(el, text) {
  if (el.textContent !== text) el.textContent = text;
}

relightBtn.addEventListener('click', () => {
  if (state.locked) return;
  // The press that snuffs the candle also puts this button on screen, right
  // under the finger that did it - and the click belonging to that same tap
  // then lands here and lights it straight back up. Snuffing the flame near
  // its base was doing exactly that. So a click only counts if the button was
  // already showing when the finger went down. Same snapshot as the canvas
  // handler above, for the same reason: reading the state inside the handler
  // is too late.
  //
  // It also means the double tap that wakes a dark screen cannot light the
  // candle by accident, which is right: waking and lighting are two separate
  // decisions.
  if (relightWasHiddenOnPress) return;
  toggleFlame();
  wake();
});

/** Replace a burnt-out candle with a new one. */
function freshCandle() {
  wax.reset();
  field.reset();
  for (let i = 0; i < 600; i++) {
    field.injectFuel(state.intensity, SUBSTEP);
    field.step(SUBSTEP);
  }
  light();
  showToast('A fresh candle');
}

// Tapping the flame itself lights or snuffs it.
//
// Two rules, both learned from getting this wrong. The first version tested a
// fixed band across the middle of the screen, which covered about a third of
// it, so almost any tap put the candle out. And it ran even while the
// controls were hidden, which meant the tap you make to bring them back also
// snuffed the flame. So: while the interface is hidden a tap only wakes it,
// and otherwise the target is the flame itself, wherever it currently is.
// Snapshot taken in the capture phase, before anything else can react to the
// press. Reading the state inside the handler itself is too late: a
// pointermove arrives first on a mouse or stylus, wakes the interface, and
// the tap then looks like it happened on a visible interface.
let uiWasHiddenOnPress = false;
let relightWasHiddenOnPress = true;
window.addEventListener('pointerdown', () => {
  uiWasHiddenOnPress = ui.classList.contains('dim');
  relightWasHiddenOnPress = relightBtn.hidden || relightBtn.classList.contains('dim');
}, { capture: true });

canvas.addEventListener('pointerdown', (e) => {
  if (state.locked) return;
  const wasHidden = uiWasHiddenOnPress;
  // Not wake(): while the candle is out and the screen has gone black, a
  // single touch here must be as inert as one anywhere else, or the double
  // tap would only be required on the parts of the screen nobody presses.
  wakeFromInput();
  if (wasHidden || state.zen) return;
  const r = canvas.getBoundingClientRect();
  if (renderer.flameHitTest(e.clientX - r.left, e.clientY - r.top)) toggleFlame();
});

// ---------------------------------------------------------------- UI plumbing
let idleTimer = 0;
function wake() {
  if (state.locked) return;
  ui.classList.remove('dim');
  clearTimeout(idleTimer);
  if (state.zen) return;
  idleTimer = setTimeout(() => ui.classList.add('dim'), 4200);
  // Coming back from the dark should feel immediate rather than waiting on
  // the quarter-second readout tick.
  syncHostBrightness();
  syncRelight();
}
/**
 * The state a snuffed candle settles into: nothing lit, and the screen has
 * taken itself down to black.
 *
 * Zen is excluded on purpose. Its whole contract is "tap anywhere to bring the
 * controls back", and that should keep working whether or not the candle
 * happens to be alight.
 */
function darkRest() {
  return !state.lit && !state.locked && !state.zen && ui.classList.contains('dim');
}

/**
 * Waking on input, except from the dark.
 *
 * The user asked for the black screen after a snuffed candle to stay - it is
 * the point of the app, not a fault - and asked for a double tap to bring it
 * back. So a single touch must not do it: a hand brushing a phone on a desk
 * would otherwise light the panel, which is exactly what was wanted gone.
 */
function wakeFromInput() {
  if (darkRest()) return;
  wake();
}
['pointerdown', 'pointermove', 'keydown'].forEach((ev) =>
  window.addEventListener(ev, wakeFromInput, { passive: true }));

let toastTimer = 0;
function showToast(msg, ms = 3400) {
  toast.textContent = msg;
  toast.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('on'), ms);
}

function press(el, on) { el.setAttribute('aria-pressed', on ? 'true' : 'false'); }

// Hold the microphone button to see exactly what went wrong, in a form that
// can be screenshotted and sent to someone who cannot reach the device.
let micHoldTimer = 0;
let micHeld = false;
btn.mic.addEventListener('pointerdown', () => {
  micHeld = false;
  clearTimeout(micHoldTimer);
  micHoldTimer = setTimeout(() => {
    micHeld = true;
    buzz(18);
    showToast(micDiagnostics(air), 9000);
  }, 600);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) =>
  btn.mic.addEventListener(ev, () => clearTimeout(micHoldTimer)));

// Microphone blow-out.
btn.mic.addEventListener('click', async () => {
  if (micHeld) { micHeld = false; return; }
  if (air.micReady) { air.disableMic(); press(btn.mic, false); showToast('Microphone off'); return; }
  showToast('Allow the microphone, then blow at your phone');
  const ok = await air.enableMic();
  press(btn.mic, ok);
  if (ok) { showToast('Blow at your phone to put it out'); return; }
  // Say what to do about it, not just what the API called it.
  const why = {
    'permission refused': 'Microphone permission was declined. Allow it in Settings to blow the candle out.',
    NotAllowedError: 'Microphone permission was declined. Allow it in Settings to blow the candle out.',
    NotReadableError: 'This phone would not open the microphone for the app. Hold this button for details and send them on.',
    'native capture refused': 'The microphone would not open. Hold this button for details and send them on.',
    'native capture threw': 'The microphone would not open. Hold this button for details and send them on.',
    NotFoundError: 'No microphone found on this device.',
  }[air.micError];
  showToast(why || `Microphone unavailable (${air.micError})`);
});

// Focus timer. Leaving the app snuffs the candle, which is the whole point.
const FOCUS_MS = 25 * 60 * 1000;
btn.focus.addEventListener('click', () => {
  if (state.mode === 'focus') { endFocus('Session ended'); return; }
  state.mode = 'focus';
  state.focusLeft = FOCUS_MS;
  state.focusPaused = false;
  press(btn.focus, true);
  timerBar.classList.add('on');
  timerNote.textContent = 'Pauses if you leave';
  light();
  showToast('25 minutes.');
});

function endFocus(msg) {
  state.mode = null;
  state.focusPaused = false;
  press(btn.focus, false);
  timerBar.classList.remove('on');
  if (msg) showToast(msg);
}

/**
 * Leaving the app pauses the session; it does not end it.
 *
 * The obvious design here is to blow the candle out the moment you check a
 * message, and call it a commitment device. It is a bad idea. Punishing
 * someone for a glance at their phone does not build the habit, it just makes
 * the app something you resent and then delete - and it means a phone call
 * costs you the session. The flame drops low while you are away, so coming
 * back to it still tells you plainly that you left, and the clock simply
 * stops rather than throwing away the time you did put in.
 */
document.addEventListener('visibilitychange', () => {
  if (state.mode !== 'focus') return;
  if (document.hidden) {
    state.focusPaused = true;
  } else {
    state.focusPaused = false;
    timerNote.textContent = 'Pauses if you leave';
  }
});

// Reading light: a wide, steady, warm pool rather than a dancing flame.
btn.read.addEventListener('click', () => {
  const on = state.mode !== 'reading';
  state.mode = on ? 'reading' : null;
  document.body.classList.toggle('reading', on);
  press(btn.read, on);
  if (on) {
    setIntensity(0.82);
    light();
    showToast('Reading light: steady and warm');
  }
});

btn.sound.addEventListener('click', () => {
  state.sound = !state.sound;
  press(btn.sound, state.sound);
  if (state.sound) { crackle.start(); crackle.setLevel(state.intensity, state.lit); }
  else crackle.stop();
});

/**
 * Solitude: the interface goes away and leaves the flame.
 *
 * Nothing else. No quotation, no daily reflection, no text at all. Anything
 * written on the screen is something the user has to read, and being asked to
 * read someone else's chosen words is the opposite of what this mode is for.
 */
/**
 * Screen lock.
 *
 * Locks out touch entirely and takes the interface away, so the candle can be
 * left on a desk without a stray brush of the hand changing anything - and so
 * a screenshot has nothing in it but the candle. Double-tap to unlock, which
 * is deliberately a gesture no accidental touch produces.
 */
btn.lock.addEventListener('click', () => {
  state.locked = true;
  press(btn.lock, true);
  document.body.classList.add('locked');
  ui.classList.add('dim');
  showToast('Screen locked. Double-tap to unlock.');
});

/**
 * Double tap: the one gesture that gets you back in.
 *
 * It serves two states, and the lock takes precedence because it is the
 * stronger claim on the screen. Neither is reachable by an accidental touch,
 * which is the reason for the gesture in both cases.
 */
let lastTapAt = 0;
window.addEventListener('pointerdown', () => {
  const unlocking = state.locked;
  if (!unlocking && !darkRest()) { lastTapAt = 0; return; }
  const now = performance.now();
  if (now - lastTapAt >= 400) { lastTapAt = now; return; }
  lastTapAt = 0;
  if (unlocking) {
    state.locked = false;
    press(btn.lock, false);
    document.body.classList.remove('locked');
    wake();
    showToast('Unlocked');
  } else {
    wake();
    buzz(10);
  }
}, { capture: true });

btn.zen.addEventListener('click', () => {
  state.zen = !state.zen;
  press(btn.zen, state.zen);
  if (state.zen) {
    ui.classList.add('dim');
    showToast('Tap anywhere to bring the controls back');
  } else {
    wake();
  }
});

// ----------------------------------------------------------------- main loop
let last = performance.now();
let carry = 0;
let fpsAcc = 0, fpsN = 0, quality = 1;

function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  // The first callback can carry a timestamp from before the synchronous
  // start-up priming ran, which makes dt negative. Clamp both ends: a
  // negative or absurd dt does not just look wrong, it makes the solver
  // diverge, and a NaN in a field like this never washes out again.
  if (!(dt > 0)) dt = 1 / 60;
  if (dt > 0.25) dt = 0.25;            // returning from a background tab

  air.update(dt);

  // The focus clock is advanced here, every frame, with the full frame time.
  // It used to be decremented inside the quarter-second display update but
  // by that update's *own* dt - a single frame - so it discarded about
  // ninety-four per cent of every interval and ran at roughly a fifteenth of
  // real speed. On a phone that reads as a timer randomly stalling.
  if (state.mode === 'focus' && !state.focusPaused) {
    state.focusLeft = Math.max(0, state.focusLeft - dt * 1000);
    if (state.focusLeft <= 0) { endFocus('Done.'); buzz([30, 60, 30]); }
  }

  // A hard enough puff strains the flame past the point where the chemistry
  // can keep up. Reading mode shields the flame so a cough does not cost you
  // your page.
  state.blowStrength = air.blow;
  if (state.lit && state.mode !== 'reading' && air.shouldExtinguish()) {
    extinguish('Blown out');
  }

  field.windX = air.windX();
  field.windY = air.windY();

  // Fixed-step physics with an accumulator.
  carry += dt;
  const steps = Math.min(MAX_SUBSTEPS * quality, Math.floor(carry / SUBSTEP));
  carry -= steps * SUBSTEP;
  if (carry > 0.1) carry = 0.1;

  const burn = state.lit ? effectiveIntensity() : 0;
  for (let s = 0; s < steps; s++) {
    if (state.lit) field.injectFuel(burn, SUBSTEP);
    field.step(SUBSTEP);
  }

  wax.update(dt, burn, state.lit);

  // Out of wax. The flame dies, and so does everything that belonged to it -
  // including the crackle, which used to carry on over an empty screen
  // because its level was only ever set when the flame was toggled by hand.
  if (wax.spent && state.lit) {
    extinguish(null);
    showToast('The candle has burned out.\nTap the ring for a fresh one.');
  }
  if (state.sound) crackle.setLevel(state.intensity, state.lit && !wax.spent);

  renderer.draw(state);
  updateReadout(dt);
  adaptQuality(dt);
}

/**
 * Reading mode holds the flame steady; otherwise the dial goes straight
 * through to the fuel supply, exactly as a wick length would.
 */
function effectiveIntensity() {
  if (state.mode === 'reading') return 0.86;
  // A paused session guts the flame down to a low ember rather than killing
  // it: enough that coming back tells you plainly that you left.
  if (state.focusPaused) return 0.12;
  return state.intensity;
}

/**
 * Drive the device's actual backlight from the flame.
 *
 * This is the part a web page cannot do for itself, and it is what the whole
 * app is for: the screen is meant to give off the light a candle gives off,
 * not merely to draw a picture of one. The native shell exposes a bridge that
 * sets brightness on its own window, which needs no permission and is
 * restored by Android the moment you leave the app. In a plain browser the
 * bridge is simply absent and nothing happens.
 */
function syncHostBrightness() {
  const host = window.CandleHost;
  if (!host || typeof host.setBrightness !== 'function') return;
  // Deliberately not driving the panel anywhere near full.
  //
  // A candle is about one candela: at arm's length that is a few lux, which
  // is very dim indeed, while a phone at full brightness is hundreds of nits.
  // On an OLED, brightness scales every lit pixel at once, so running the
  // backlight high would make a dark room glow orange and give the whole
  // illusion away - quite apart from the battery. This range reads as a
  // candle in the dark and still has headroom in a lit room.
  //
  // A snuffed candle takes the panel to almost nothing, and stays there. That
  // is the user's own preference and not an oversight: with no flame there is
  // no light to give off, and a phone quietly glowing at a dead candle would
  // give the whole thing away. The cost is that the controls become
  // unreadable, so waking the interface - which now takes a deliberate double
  // tap - lifts the panel to somewhere you can actually see it.
  const target = state.lit
    ? OLED_MIN_BRIGHTNESS + renderer.luminance() * (OLED_MAX_BRIGHTNESS - OLED_MIN_BRIGHTNESS)
    : (ui.classList.contains('dim') ? OUT_ASLEEP_BRIGHTNESS : OUT_AWAKE_BRIGHTNESS);
  // Ease towards it: matching the flicker frame for frame would make the
  // backlight buzz, because the panel responds far more slowly than the
  // rendered flame does. That only applies to a live flame, though - with the
  // candle out there is nothing to smooth, and a slow fade up would make the
  // double tap feel like it had not registered.
  hostBrightness += (target - hostBrightness) * (state.lit ? 0.18 : 0.5);
  try {
    host.setBrightness(hostBrightness);
  } catch (e) {
    /* the bridge went away; nothing to do about it */
  }
}
let hostBrightness = 0.35;
const OLED_MIN_BRIGHTNESS = 0.08;
const OLED_MAX_BRIGHTNESS = 0.70;
/** Candle out, screen asleep: as near off as the platform allows. */
const OUT_ASLEEP_BRIGHTNESS = 0.03;
/** Candle out, screen woken by a double tap: readable, not glaring. */
const OUT_AWAKE_BRIGHTNESS = 0.35;

let readoutAcc = 0;
function updateReadout(dt) {
  readoutAcc += dt;
  if (readoutAcc < 0.25) return;
  readoutAcc = 0;
  syncHostBrightness();
  // Four times a second is ample: the wick descends over minutes.
  syncRelight();

  if (state.mode === 'focus') {
    const m = Math.floor(state.focusLeft / 60000);
    const sec = Math.floor((state.focusLeft % 60000) / 1000);
    timerText.textContent = `${m}:${String(sec).padStart(2, '0')}`;
  }

  if (state.zen || state.mode === 'reading') { readout.textContent = ''; return; }

  // Live physical state, in real units. It is the honest version of a
  // progress bar: these are the numbers the simulation is actually running.
  const cd = (LUMINOUS_INTENSITY * (state.lit ? effectiveIntensity() : 0)).toFixed(2);
  const mm = (wax.centreHeight() * 1000).toFixed(0);
  const hrs = wax.elapsed / 3600;
  readout.innerHTML =
    `<span><b>${cd}</b> cd</span>` +
    `<span><b>${mm}</b> mm</span>` +
    `<span><b>${hrs < 10 ? hrs.toFixed(1) : Math.round(hrs)}</b> h burnt</span>`;
}

/**
 * Drop the physics substep budget on devices that cannot keep up, rather
 * than letting the whole thing judder. The flame simply flickers a little
 * more coarsely.
 */
function adaptQuality(dt) {
  fpsAcc += dt; fpsN++;
  if (fpsN < 90) return;
  const avg = fpsAcc / fpsN;
  fpsAcc = 0; fpsN = 0;
  if (avg > 0.026 && quality > 0.5) quality = 0.5;
  else if (avg > 0.040 && quality > 0.3) quality = 0.3;
  else if (avg < 0.019 && quality < 1) quality = Math.min(1, quality + 0.25);
}

// ------------------------------------------------------------------- startup
setIntensity(0.7);
air.attachTilt();

// Give the flame a moment of simulated time so it opens already burning
// instead of igniting in front of the user.
for (let i = 0; i < 900; i++) {
  field.injectFuel(0.7, SUBSTEP);
  field.step(SUBSTEP);
}

wake();
requestAnimationFrame(frame);

// Exposed for the headless render check in tools/shoot.mjs.
window.__candle = { field, wax, air, state, renderer, setIntensity, extinguish, light };
</script>
